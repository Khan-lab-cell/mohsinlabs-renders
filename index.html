<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadster Full Render</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; font-family: 'Inter', sans-serif; }
        #root { width: 100vw; height: 100vh; position: relative; }
        .scene-host { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
    </style>
</head>
<body data-duration="30">
    <div id="root" data-duration="30">
        <div id="shot1" class="scene-host" data-composition-id="shot1" data-duration="5"></div>
        <div id="shot2" class="scene-host" data-composition-id="shot2" data-duration="5"></div>
        <div id="shot3" class="scene-host" data-composition-id="shot3" data-duration="5"></div>
        <div id="shot4" class="scene-host" data-composition-id="shot4" data-duration="5"></div>
        <div id="shot5" class="scene-host" data-composition-id="shot5" data-duration="5"></div>
        <div id="shot6" class="scene-host" data-composition-id="shot6" data-duration="5"></div>
    </div>
    <script>
        window.__timelines = {};
        const tl = gsap.timeline();
        for(let i=1; i<=6; i++) {
            const shot = document.getElementById('shot' + i);
            if (shot) {
                tl.to(shot, { opacity: 1, duration: 0.5 }, (i-1)*5);
                tl.to(shot, { opacity: 0, duration: 0.5 }, (i*5) - 0.5);
            }
        }
        window.__timelines['main'] = tl;
    </script>
</body>
</html>
